  <text x="80" y="380" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="76" font-weight="700" fill="#f0f6fc" letter-spacing="-2">查看網頁<tspan fill="url(#accent)">原始碼</tspan></text>
  <text x="80" y="450" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" fill="#9198a1">語法高亮 · 即時搜尋 · DOM/Source 切換</text>
  <g transform="translate(80, 510)">
