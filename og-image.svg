    <text x="28" y="38" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="white" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <text x="156" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="600" fill="#9198a1">View Source</text>
